# Explicit test override only. No real recipients or externally published SMTP port.
services:
  smtp-test:
    image: plusfolio-app:local
    command: [python,deploy/smtp_test.py]
    user: "65532:65532"
    networks: [frontend]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
