# Test-only HTTPS edge and SMTP sink; never used by the installer.
services:
  smtp-test:
    image: ${PLUSFOLIO_APP_IMAGE:-plusfolio-app:local}
    command: [python,deploy/smtp_test.py]
    user: "65532:65532"
    networks: [frontend]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.1
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  proxy:
    image: caddy:2.11.7-alpine
    environment: {PUBLIC_HOST: localhost, ACME_EMAIL: admin@delivery.example.test}
    ports: ["127.0.0.1:18443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - test-certificates:/data
      - test-proxy-config:/config
    networks: [frontend]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.1
    pids_limit: 32
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on: {web: {condition: service_healthy}}
volumes:
  test-certificates: {}
  test-proxy-config: {}
