name: Verify server installation
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify product version and frontend mirrors
        run: python3 scripts/release.py --check
      - name: Verify stable release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release.py --check-tag "$GITHUB_REF_NAME"
      - name: Verify shared-host safeguards and backup retention
        run: python3 deploy/test_shared_host.py
      - name: Build a clean Linux server and exercise HTTPS, SMTP, CPU search, TeX and backups
        run: python3 deploy/check_server.py --keep
      - name: Verify download integrity and immutable dependency locks
        run: docker compose --env-file .deploy/env -f compose.yml run --rm --no-deps web python deploy/test_downloads.py
      - name: Verify configurable storage, offsite backups and immutable releases
        run: docker compose --env-file .deploy/env -f compose.yml run --rm --no-deps web python deploy/test_cloud_deploy.py
      - name: Run backend regression suite in a disposable SQLite test database
        run: >-
          docker compose --env-file .deploy/env -f compose.yml -f deploy/compose.test.yml run --rm --no-deps
          -e PLUSFOLIO_DEMO=1 -e POSTGRES_HOST= -e REDIS_URL= web
          python backend/manage.py test core --noinput
      - name: Capture service diagnostics
        if: failure()
        run: docker compose --env-file .deploy/env -f compose.yml -f deploy/compose.test.yml logs --tail 100
      - name: Remove disposable test volumes
        if: always()
        run: docker compose --env-file .deploy/env -f compose.yml -f deploy/compose.test.yml down --volumes --remove-orphans
